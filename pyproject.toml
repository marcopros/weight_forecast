[project]
name = "cumulative-weight-forecast"
version = "1.0.0"
description = "MLOps pipeline for cumulative raw material delivery weight forecasting"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.1",
    "numpy>=1.25",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "mlflow>=2.10",
    "dvc>=3.40",
    "evidently>=0.4",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
